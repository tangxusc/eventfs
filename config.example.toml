# EventStore 服务器配置示例

[node]
id = 1
listen_addr = "127.0.0.1:50051"

# 集群节点列表（3 节点示例）。非空即触发启动时自动组建集群（etcd 静态引导语义）：
# - 必须包含本节点，且所有节点配置完全一致（不一致可能形成双集群）
# - addr 可省略 http:// 前缀（省略时按 http 处理）；TLS 部署必须显式写 https://
# - 留空则不自动组建，需经 RaftAdmin 手动组建
[[node.peers]]
id = 1
addr = "https://127.0.0.1:50051"

[[node.peers]]
id = 2
addr = "https://127.0.0.1:50052"

[[node.peers]]
id = 3
addr = "https://127.0.0.1:50053"

# TLS 配置（可选）。配置即启用 TLS 监听（listen_addr 变为 https 服务）：
# - cert_file / key_file 必须成对提供（PEM 格式）
# - ca_file 可选：配置后节点间 RPC / 客户端 API 对 https:// 对端严格校验证书链；
#   缺省跳过校验（自签证书场景，等价 curl -k）
# - TLS 部署时所有节点 peers 的 addr 必须写 https:// 前缀（裸地址会被补成 http://）
# - 自签证书必须显式 CA:FALSE（openssl req -x509 默认 CA:TRUE，严格校验会报
#   CaUsedAsEndEntity）：
#     openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.crt \
#       -days 365 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1" \
#       -addext "basicConstraints=critical,CA:FALSE"
# - 证书轮换需要重启节点生效
[tls]
cert_file = "./certs/server.crt"
key_file = "./certs/server.key"
ca_file = "./certs/ca.crt"   # 可选；删掉本行则跳过校验

[storage]
data_dir = "./data/node1"

# 快照配置（可选，可整体缺省；缺省值见注释）
# compression：快照压缩算法，zstd（压缩率高）/ lz4（速度快）/ none（不压缩）；
#              快照文件头记录算法，读取时自动识别，节点间可混用不同算法
# keep：保留历史快照数（含最新），超出部分自动清理；默认 3
# max_chunk_size：快照分块大小（字节），默认 3145728（3MiB）。openraft 对
#                 超限快照块直接放弃传输（无拆小路径），上限 6MiB 由启动校验
#                 保证不会触线（8MB 消息上限 - 余量）
# dir：快照目录，缺省为 {data_dir}/snapshots（独立于业务数据文件）
[snapshot]
compression = "zstd"
keep = 3
max_chunk_size = 3145728
# dir = "./data/node1/snapshots"

# 请求大小限制（可选，可整体缺省；缺省值见注释）
# max_event_bytes：单事件 data+metadata 上限（字节），默认 1048576（1MiB）。
#                  一条 append 批在 raft 里是一条日志条目，单条日志超限时
#                  openraft 无拆小路径（复制停滞），必须源头拦截
# max_append_batch_bytes：单次 append 请求上限（字节），默认 7340032（7MiB，
#                  8MB 传输上限 - 余量）。服务端按 proto 编码精确字节数校验，
#                  超限返回 FailedPrecondition（"append payload too large..."）
[limits]
max_event_bytes = 1048576
max_append_batch_bytes = 7340032

[shards]
num_shards = 8
