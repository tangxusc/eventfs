# EventStore 服务器配置示例

[node]
id = 1
listen_addr = "127.0.0.1:50051"

# 集群节点列表（3 节点示例）。非空即触发启动时自动组建集群（etcd 静态引导语义）：
# - 必须包含本节点，且所有节点配置完全一致（不一致可能形成双集群）
# - addr 可省略 http:// 前缀
# - 留空则不自动组建，需经 RaftAdmin 手动组建
[[node.peers]]
id = 1
addr = "127.0.0.1:50051"

[[node.peers]]
id = 2
addr = "127.0.0.1:50052"

[[node.peers]]
id = 3
addr = "127.0.0.1:50053"

[storage]
data_dir = "./data/node1"

[shards]
num_shards = 8
