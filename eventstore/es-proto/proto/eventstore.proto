syntax = "proto3";

package eventstore.v1;

// 客户端 API：事件溯源读写与订阅
service EventStore {
  // 追加事件，携带乐观并发期望版本
  rpc Append(AppendRequest) returns (AppendResponse);
  // 读取单个流的事件区间，流式返回
  rpc ReadStream(ReadStreamRequest) returns (stream ReadEventsResponse);
  // 读取分片内 $all 流；跨分片仅按 (shard_id, position) 归并，非严格全序
  rpc ReadAll(ReadAllRequest) returns (stream ReadEventsResponse);
  // 订阅：先补齐历史（catch-up），追平后转为实时推送
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
  // 查询流元数据（当前版本等）
  rpc GetStreamMeta(GetStreamMetaRequest) returns (GetStreamMetaResponse);
  // 显式创建流：服务端分配 shard（大致最少流），返回流归属
  rpc CreateStream(CreateStreamRequest) returns (CreateStreamResponse);
}

// 持久化拉取订阅：服务端保存竞争消费者组、checkpoint、租约与失败状态。
service PersistentSubscriptions {
  rpc CreatePersistentSubscription(CreatePersistentSubscriptionRequest) returns (PersistentSubscriptionInfo);
  rpc UpdatePersistentSubscription(UpdatePersistentSubscriptionRequest) returns (PersistentSubscriptionInfo);
  rpc DeletePersistentSubscription(DeletePersistentSubscriptionRequest) returns (Empty);
  rpc GetPersistentSubscription(GetPersistentSubscriptionRequest) returns (PersistentSubscriptionInfo);
  rpc ListPersistentSubscriptions(ListPersistentSubscriptionsRequest) returns (ListPersistentSubscriptionsResponse);
  // unary 长轮询；消费者用条数、字节与等待时间主动施加背压。
  rpc FetchPersistentSubscription(FetchPersistentSubscriptionRequest) returns (FetchPersistentSubscriptionResponse);
  // 一次结算多个 delivery，每条独立返回结果。
  rpc SettlePersistentSubscription(SettlePersistentSubscriptionRequest) returns (SettlePersistentSubscriptionResponse);
  rpc ListParkedPersistentSubscription(ListParkedPersistentSubscriptionRequest) returns (ListParkedPersistentSubscriptionResponse);
  rpc ReplayParkedPersistentSubscription(ReplayParkedPersistentSubscriptionRequest) returns (ReplayParkedPersistentSubscriptionResponse);
}

// 聚合类型事件集 API；与 EventStore Stream 数据和版本语义完全隔离。
service AggregateStore {
  rpc GetAggregateStoreCapabilities(GetAggregateStoreCapabilitiesRequest) returns (AggregateStoreCapabilities);
  rpc CreateEventSet(CreateEventSetRequest) returns (AggregateEventSetInfo);
  rpc ListEventSets(ListEventSetsRequest) returns (ListEventSetsResponse);
  rpc GetEventSet(GetEventSetRequest) returns (AggregateEventSetInfo);
  rpc AppendAggregateEvent(AppendAggregateEventRequest) returns (AppendAggregateEventResponse);
  // 从 Beginning、Now 或 opaque cursor 追平后持续跟随。
  rpc ReadAggregateEvents(ReadAggregateEventsRequest) returns (stream ReadAggregateEventsResponse);
  rpc ListAggregateStates(ListAggregateStatesRequest) returns (ListAggregateStatesResponse);
  rpc GetAggregateState(GetAggregateStateRequest) returns (GetAggregateStateResponse);
  rpc PutAggregateState(PutAggregateStateRequest) returns (PutAggregateStateResponse);
  rpc GetAggregateStoreStatus(GetAggregateStoreStatusRequest) returns (AggregateStoreStatus);
  rpc ListAggregatePartitions(ListAggregatePartitionsRequest) returns (ListAggregatePartitionsResponse);
  rpc CreateAggregateGroup(CreateAggregateGroupRequest) returns (AggregateGroupInfo);
  rpc UpdateAggregateGroup(UpdateAggregateGroupRequest) returns (AggregateGroupInfo);
  rpc DeleteAggregateGroup(DeleteAggregateGroupRequest) returns (Empty);
  rpc GetAggregateGroup(GetAggregateGroupRequest) returns (AggregateGroupInfo);
  rpc ListAggregateGroups(ListAggregateGroupsRequest) returns (ListAggregateGroupsResponse);
  rpc FetchAggregateGroup(FetchAggregateGroupRequest) returns (FetchAggregateGroupResponse);
  rpc SettleAggregateGroup(SettleAggregateGroupRequest) returns (SettleAggregateGroupResponse);
  rpc RenewAggregateGroup(RenewAggregateGroupRequest) returns (RenewAggregateGroupResponse);
}

message AggregateEventSetRef {
  string business_space = 1;
  string aggregate_type = 2;
}

enum AggregateEventSetStatus {
  AGGREGATE_EVENT_SET_CREATING = 0;
  AGGREGATE_EVENT_SET_ACTIVE = 1;
}

message AggregateEventSetInfo {
  AggregateEventSetRef event_set = 1;
  uint32 partition_count = 2;
  string hash_algorithm = 3;
  AggregateEventSetStatus status = 4;
  uint64 catalog_revision = 5;
}

message GetAggregateStoreCapabilitiesRequest {}

message AggregateStoreCapabilities {
  string api_version = 1;
  uint32 partition_count = 2;
  uint64 max_event_bytes = 3;
  uint64 max_state_bytes = 4;
  bool state_revision_cas = 5;
  bool explicit_group_settlement = 6;
  bool state_modified_time = 7;
}

message CreateEventSetRequest {
  AggregateEventSetRef event_set = 1;
  // 16 字节 UUID；中断重试必须复用。
  bytes operation_id = 2;
}

message ListEventSetsRequest {}
message ListEventSetsResponse { repeated AggregateEventSetInfo event_sets = 1; }
message GetEventSetRequest { AggregateEventSetRef event_set = 1; }

message ExpectedAggregateVersion {
  oneof kind {
    Empty any = 1;
    Empty no_aggregate = 2;
    Empty aggregate_exists = 3;
    uint64 exact = 4;
  }
}

message NewAggregateEvent {
  bytes event_id = 1;
  string event_type = 2;
  bytes data = 3;
  bytes metadata = 4;
}

message AggregateEvent {
  string aggregate_id = 1;
  uint64 aggregate_version = 2;
  bytes event_id = 3;
  string event_type = 4;
  bytes data = 5;
  bytes metadata = 6;
  Hlc hlc = 7;
}

message AppendAggregateEventRequest {
  AggregateEventSetRef event_set = 1;
  string aggregate_id = 2;
  ExpectedAggregateVersion expected_version = 3;
  NewAggregateEvent event = 4;
}

message AppendAggregateEventResponse { uint64 aggregate_version = 1; }

message AggregateReadStart {
  oneof kind {
    Empty beginning = 1;
    Empty now = 2;
    bytes cursor = 3;
  }
}

message ReadAggregateEventsRequest {
  AggregateEventSetRef event_set = 1;
  AggregateReadStart start = 2;
}

message AggregateReadDegraded {
  uint32 unavailable_source_count = 1;
  bool retrying = 2;
}

message ReadAggregateEventsResponse {
  oneof payload {
    AggregateEvent event = 1;
    Empty caught_up = 2;
    AggregateReadDegraded degraded = 3;
    Empty recovered = 4;
  }
  // 消费完当前 frame 后的 opaque 续读位置。
  bytes cursor = 5;
}

message ListAggregateStatesRequest {
  AggregateEventSetRef event_set = 1;
  uint32 page_size = 2;
  bytes page_token = 3;
}

message AggregateStateInfo {
  string aggregate_id = 1;
  uint64 revision = 2;
  uint64 modified_unix_millis = 3;
}

message ListAggregateStatesResponse {
  repeated AggregateStateInfo states = 1;
  bytes next_page_token = 2;
}

message GetAggregateStateRequest {
  AggregateEventSetRef event_set = 1;
  string aggregate_id = 2;
}

message GetAggregateStateResponse {
  uint64 revision = 1;
  bytes data = 2;
  uint64 modified_unix_millis = 3;
}

message ExpectedStateRevision {
  oneof kind {
    Empty absent = 1;
    uint64 exact = 2;
  }
}

message PutAggregateStateRequest {
  AggregateEventSetRef event_set = 1;
  string aggregate_id = 2;
  ExpectedStateRevision expected_revision = 3;
  bytes data = 4;
}

message PutAggregateStateResponse {
  uint64 revision = 1;
  uint64 modified_unix_millis = 2;
}
message GetAggregateStoreStatusRequest {}

message AggregateStoreStatus {
  uint64 catalog_revision = 1;
  uint32 event_set_count = 2;
  uint32 creating_event_set_count = 3;
  uint32 active_event_set_count = 4;
}

message ListAggregatePartitionsRequest { AggregateEventSetRef event_set = 1; }

message AggregatePartitionInfo {
  uint32 partition_id = 1;
  uint64 shard_id = 2;
  uint64 generation = 3;
  bool moving = 4;
  uint64 target_shard_id = 5;
}

message ListAggregatePartitionsResponse { repeated AggregatePartitionInfo partitions = 1; }

message AggregateGroupStart {
  oneof kind {
    Empty beginning = 1;
    Empty now = 2;
  }
}

message AggregateGroupSettings {
  uint32 max_unacked_per_consumer = 1;
  uint32 max_unacked_per_group = 2;
  uint64 ack_timeout_ms = 3;
  uint32 max_retries = 4;
  uint64 retry_min_ms = 5;
  uint64 retry_max_ms = 6;
}

message AggregateGroupInfo {
  AggregateEventSetRef event_set = 1;
  string name = 2;
  uint64 revision = 3;
  uint64 epoch = 4;
  AggregateGroupStart start = 5;
  AggregateGroupSettings settings = 6;
}

message CreateAggregateGroupRequest {
  AggregateEventSetRef event_set = 1;
  string name = 2;
  AggregateGroupStart start = 3;
  AggregateGroupSettings settings = 4;
  bytes operation_id = 5;
}

message UpdateAggregateGroupRequest {
  AggregateEventSetRef event_set = 1;
  string name = 2;
  uint64 expected_revision = 3;
  AggregateGroupStart start = 4;
  AggregateGroupSettings settings = 5;
  bytes operation_id = 6;
}

message DeleteAggregateGroupRequest {
  AggregateEventSetRef event_set = 1;
  string name = 2;
  uint64 expected_revision = 3;
  bytes operation_id = 4;
}

message GetAggregateGroupRequest {
  AggregateEventSetRef event_set = 1;
  string name = 2;
}

message ListAggregateGroupsRequest { AggregateEventSetRef event_set = 1; }
message ListAggregateGroupsResponse { repeated AggregateGroupInfo groups = 1; }

message AggregateGroupDelivery {
  bytes delivery_id = 1;
  AggregateEvent event = 2;
  uint32 attempt = 3;
  uint64 deadline_ms = 4;
  bool replayed = 5;
}

message FetchAggregateGroupRequest {
  AggregateEventSetRef event_set = 1;
  string name = 2;
  string consumer_id = 3;
  uint32 max_events = 4;
  uint64 max_bytes = 5;
  uint64 wait_ms = 6;
}

message FetchAggregateGroupResponse {
  repeated AggregateGroupDelivery deliveries = 1;
  bool caught_up = 2;
  bool throttled = 3;
}

enum AggregateGroupSettlementAction {
  AGGREGATE_GROUP_SETTLEMENT_ACK = 0;
  AGGREGATE_GROUP_SETTLEMENT_RETRY = 1;
  AGGREGATE_GROUP_SETTLEMENT_PARK = 2;
  AGGREGATE_GROUP_SETTLEMENT_SKIP = 3;
}

message AggregateGroupSettlement {
  bytes delivery_id = 1;
  AggregateGroupSettlementAction action = 2;
  string reason = 3;
}

enum AggregateGroupSettlementStatus {
  AGGREGATE_GROUP_SETTLEMENT_APPLIED = 0;
  AGGREGATE_GROUP_SETTLEMENT_ALREADY_SETTLED = 1;
  AGGREGATE_GROUP_SETTLEMENT_STALE_LEASE = 2;
  AGGREGATE_GROUP_SETTLEMENT_WRONG_CONSUMER = 3;
}

message AggregateGroupSettlementResult {
  bytes delivery_id = 1;
  AggregateGroupSettlementStatus status = 2;
  // Renew 成功后的服务端租约截止时间；Settle 或未续租时为 0。
  uint64 deadline_ms = 3;
}

message SettleAggregateGroupRequest {
  AggregateEventSetRef event_set = 1;
  string name = 2;
  string consumer_id = 3;
  repeated AggregateGroupSettlement settlements = 4;
}

message SettleAggregateGroupResponse {
  repeated AggregateGroupSettlementResult results = 1;
}

message RenewAggregateGroupRequest {
  AggregateEventSetRef event_set = 1;
  string name = 2;
  string consumer_id = 3;
  repeated bytes delivery_ids = 4;
}

message RenewAggregateGroupResponse {
  repeated AggregateGroupSettlementResult results = 1;
}

// 创建流请求
message CreateStreamRequest {
  string stream_id = 1;
}

// 创建流响应
message CreateStreamResponse {
  // 分配的 shard；exists=true 时表示已有归属（幂等）
  uint64 shard_id = 1;
  // 该 shard 的 leader 地址（http(s)://host:port，可用于直连），
  // 未知时为空字符串（调用方可经常规重定向路径定位）
  string leader_addr = 2;
  // true 表示流已存在（本次调用未新建）
  bool exists = 3;
}

// 混合逻辑时钟：由 leader 在写入前分配并随事件落盘
message Hlc {
  uint64 wall = 1;    // 物理时间，毫秒
  uint32 logical = 2; // 同毫秒内逻辑计数
}

// 乐观并发期望版本
message ExpectedVersion {
  oneof kind {
    Empty any = 1;           // 不校验
    Empty no_stream = 2;     // 要求流不存在
    Empty stream_exists = 3; // 要求流已存在
    uint64 exact = 4;        // 要求当前版本恰为该值
  }
}

message Empty {}

// 待写入事件，version/position/hlc 由服务端分配
message NewEvent {
  bytes event_id = 1;    // 16 字节 UUID，用于幂等去重
  string event_type = 2;
  bytes data = 3;
  bytes metadata = 4;
}

// 已持久化事件
message Event {
  string stream_id = 1;
  uint64 version = 2;
  bytes event_id = 3;
  string event_type = 4;
  bytes data = 5;
  bytes metadata = 6;
  Hlc hlc = 7;
  uint64 position = 8; // 分片内提交位置
  uint64 shard_id = 9;
}

message AppendRequest {
  string stream_id = 1;
  ExpectedVersion expected_version = 2;
  repeated NewEvent events = 3;
}

message AppendResponse {
  uint64 next_expected_version = 1; // 追加后的当前版本
  uint64 first_position = 2;        // 本批首条事件的分片内位置
  uint64 last_position = 3;
  uint64 shard_id = 4;
}

// 读取方向
enum Direction {
  DIRECTION_FORWARD = 0;
  DIRECTION_BACKWARD = 1;
}

message ReadStreamRequest {
  string stream_id = 1;
  uint64 from_version = 2;
  // 0 表示不限量，由服务端按流控上限截断
  uint64 max_count = 3;
  Direction direction = 4;
}

// 单个分片的读取游标
message ShardPosition {
  uint64 shard_id = 1;
  // 起始 position（含）
  uint64 from_position = 2;
  // 反向读尽标记：该分片反向已消费到 position 0（最早事件），不再有更早
  // 的事件可读。仅反向翻页由服务端置 true；true 时服务端对该分片返回
  // 空页且游标保持不变。正向（或其它用法）恒为 false。
  bool ended = 3;
}

message ReadAllRequest {
  repeated uint64 shard_ids = 1;
  // 所有分片统一的起始 position。
  // 各分片的 position 序列相互独立，此字段表示「每个分片都从该值开始读」，
  // 仅适合首页查询。翻页请用 from_positions。
  uint64 from_position = 2;
  uint64 max_count = 3;
  Direction direction = 4;
  // 逐分片游标。非空时覆盖 shard_ids 与 from_position。
  //
  // 翻页必须用它：跨分片归并后，各分片被消费到的位置不同，
  // 用单一 from_position 续读会重复或漏掉事件。
  // 首页可不传（用 shard_ids + from_position），续页请把上一页响应里的
  // next_positions 原样透传，不要自行构造——服务端才知道每分片实际读到的边界。
  repeated ShardPosition from_positions = 5;
}

message ReadEventsResponse {
  repeated Event events = 1;
  // 仅 ReadAll 填充：每分片一条，为「该分片下一页的续读起点」。
  // 正序 = 本页最后一条 position + 1；倒序 = 本页最小 position - 1。
  // 本页未读到事件的分片起点不变；倒序消费到 position 0 的分片置
  // ended=true（该分片已读尽，不再有更早事件）。客户端翻页时原样
  // 透传为 ReadAllRequest.from_positions。
  repeated ShardPosition next_positions = 2;
}

// 公共订阅目标：客户端只面向 stream，不感知内部 shard。
message SubscribeStreams {
  repeated string stream_ids = 1;
}

message SubscribeRequest {
  oneof target {
    SubscribeStreams streams = 1; // 订阅一个或多个 stream
    Empty all = 2;               // 订阅当前集群全部 stream
  }
}

// 订阅公开事件：不暴露内部 shard 或分片 position。
message SubscriptionEvent {
  string stream_id = 1;
  uint64 version = 2;
  bytes event_id = 3;
  string event_type = 4;
  bytes data = 5;
  bytes metadata = 6;
  Hlc hlc = 7;
}

message SubscribeResponse {
  oneof payload {
    SubscriptionEvent event = 1;
    // catch-up 阶段结束、转入实时推送的分界信号
    Empty caught_up = 2;
    // 部分内部来源不可用；不包含 shard、节点或路由细节。
    Empty degraded = 3;
  }
}

// 持久化订阅目标；与临时 Subscribe 一样不向客户端暴露 shard。
message PersistentSubscriptionTarget {
  oneof target {
    SubscribeStreams streams = 1;
    Empty all = 2;
  }
}

enum PersistentStartDefault {
  PERSISTENT_START_BEGINNING = 0;
  PERSISTENT_START_NOW = 1;
}

// 创建起点：默认策略 + 逐 Stream inclusive next_version 覆盖。
message PersistentStartSpec {
  PersistentStartDefault default = 1;
  map<string, uint64> next_versions = 2;
}

message PersistentSubscriptionSettings {
  // 0 使用服务端默认值。
  uint32 max_unacked_per_consumer = 1;
  uint32 max_unacked_per_group = 2;
  uint64 ack_timeout_ms = 3;
  uint32 max_retries = 4;
  uint64 retry_min_ms = 5;
  uint64 retry_max_ms = 6;
}

message CreatePersistentSubscriptionRequest {
  string name = 1;
  PersistentSubscriptionTarget target = 2;
  PersistentStartSpec start = 3;
  PersistentSubscriptionSettings settings = 4;
}

message PersistentStreamReset {
  string stream_id = 1;
  oneof start {
    Empty beginning = 2;
    Empty now = 3;
    uint64 next_version = 4;
  }
}

message UpdatePersistentSubscriptionRequest {
  string name = 1;
  uint64 expected_revision = 2;
  // 缺失表示不修改。
  PersistentSubscriptionTarget target = 3;
  // 缺失表示不修改。
  PersistentSubscriptionSettings settings = 4;
  repeated PersistentStreamReset resets = 5;
}

message DeletePersistentSubscriptionRequest {
  string name = 1;
  uint64 expected_revision = 2;
}

message GetPersistentSubscriptionRequest { string name = 1; }
message ListPersistentSubscriptionsRequest {}

message PersistentSubscriptionInfo {
  string name = 1;
  uint64 revision = 2;
  uint64 epoch = 3;
  PersistentSubscriptionTarget target = 4;
  PersistentSubscriptionSettings settings = 5;
  uint64 stream_count = 6;
  uint64 active_delivery_count = 7;
  uint64 parked_count = 8;
}

message ListPersistentSubscriptionsResponse {
  repeated PersistentSubscriptionInfo subscriptions = 1;
}

message FetchPersistentSubscriptionRequest {
  string name = 1;
  string consumer_id = 2;
  // 0 使用默认值；服务端分别限制为 1000 条、7 MiB、30 秒。
  uint32 max_events = 3;
  uint64 max_bytes = 4;
  uint64 wait_ms = 5;
}

message PersistentDelivery {
  bytes delivery_id = 1;
  SubscriptionEvent event = 2;
  uint32 attempt = 3;
  uint64 lease_deadline_ms = 4;
  uint64 group_epoch = 5;
  bool replayed = 6;
}

message FetchPersistentSubscriptionResponse {
  repeated PersistentDelivery deliveries = 1;
  bool caught_up = 2;
  bool throttled = 3;
  uint64 retry_after_ms = 4;
}

enum PersistentSettlementAction {
  PERSISTENT_SETTLEMENT_ACK = 0;
  PERSISTENT_SETTLEMENT_RETRY = 1;
  PERSISTENT_SETTLEMENT_PARK = 2;
  PERSISTENT_SETTLEMENT_SKIP = 3;
}

message PersistentSettlement {
  bytes delivery_id = 1;
  PersistentSettlementAction action = 2;
  string reason = 3;
}

message SettlePersistentSubscriptionRequest {
  string name = 1;
  string consumer_id = 2;
  uint64 group_epoch = 3;
  repeated PersistentSettlement settlements = 4;
}

enum PersistentSettlementStatus {
  PERSISTENT_SETTLEMENT_APPLIED = 0;
  PERSISTENT_SETTLEMENT_ALREADY_SETTLED = 1;
  PERSISTENT_SETTLEMENT_STALE_LEASE = 2;
  PERSISTENT_SETTLEMENT_WRONG_CONSUMER = 3;
}

message PersistentSettlementResult {
  bytes delivery_id = 1;
  PersistentSettlementStatus status = 2;
}

message SettlePersistentSubscriptionResponse {
  repeated PersistentSettlementResult results = 1;
}

message ListParkedPersistentSubscriptionRequest {
  string name = 1;
  uint32 offset = 2;
  uint32 limit = 3; // 0 使用默认 100，上限 1000
}

message ParkedPersistentEvent {
  bytes parked_id = 1;
  SubscriptionEvent event = 2;
  uint32 attempts = 3;
  string reason = 4;
  uint64 parked_at_ms = 5;
}

message ListParkedPersistentSubscriptionResponse {
  repeated ParkedPersistentEvent events = 1;
  uint32 next_offset = 2;
}

message ReplayParkedPersistentSubscriptionRequest { string name = 1; }
message ReplayParkedPersistentSubscriptionResponse { uint64 replayed_count = 1; }

// ============================================================================
// InternalSubscription：节点间分片订阅转发，绝不作为客户端契约使用。
// ============================================================================

service InternalSubscription {
  rpc SubscribeInternal(InternalSubscribeRequest) returns (stream InternalSubscribeResponse);
  // 控制 Shard 协调器按 Stream checkpoint 批量读取远程数据 Shard。
  rpc ReadPersistentBatch(InternalPersistentReadRequest) returns (InternalPersistentReadResponse);
}

// 归属共识与 fencing 的节点间协议，只能注册到内部监听端口。
service OwnershipInternal {
  rpc CommitOwnership(CommitOwnershipRequest) returns (CommitOwnershipResponse);
  rpc InstallOwnershipFence(InstallOwnershipFenceRequest) returns (InstallOwnershipFenceResponse);
}

// AggregateStore 的节点间显式 Shard 协议，只注册到内部监听端口。
service AggregateStoreInternal {
  rpc GetAggregateCatalogInternal(GetAggregateCatalogInternalRequest) returns (GetAggregateCatalogInternalResponse);
  rpc CommitAggregateCatalogInternal(CommitAggregateCatalogInternalRequest) returns (CommitAggregateCatalogInternalResponse);
  rpc InstallAggregatePartitionFenceInternal(InstallAggregatePartitionFenceInternalRequest) returns (InstallAggregatePartitionFenceInternalResponse);
  rpc SubscribeAggregatePartitionsInternal(SubscribeAggregatePartitionsInternalRequest) returns (stream SubscribeAggregatePartitionsInternalResponse);
  rpc ListAggregatePartitionStatesInternal(ListAggregatePartitionStatesInternalRequest) returns (ListAggregatePartitionStatesInternalResponse);
  rpc GetAggregateGroupCatalogInternal(GetAggregateGroupCatalogInternalRequest) returns (GetAggregateGroupCatalogInternalResponse);
  rpc CommitAggregateGroupCatalogInternal(CommitAggregateGroupCatalogInternalRequest) returns (CommitAggregateGroupCatalogInternalResponse);
  rpc FetchAggregateGroupPartitionInternal(FetchAggregateGroupPartitionInternalRequest) returns (FetchAggregateGroupPartitionInternalResponse);
  rpc ApplyAggregateGroupPartitionInternal(ApplyAggregateGroupPartitionInternalRequest) returns (ApplyAggregateGroupPartitionInternalResponse);
}

message GetAggregateCatalogInternalRequest { uint64 control_shard_id = 1; }
message GetAggregateCatalogInternalResponse { bytes payload = 1; }

message CommitAggregateCatalogInternalRequest {
  uint64 control_shard_id = 1;
  bytes payload = 2; // bincode 编码的 AggregateCatalogCommand
}

message CommitAggregateCatalogInternalResponse {
  bytes payload = 1; // bincode 编码的 AggregateCatalogApply
}

message InstallAggregatePartitionFenceInternalRequest {
  uint64 shard_id = 1;
  AggregateEventSetRef event_set = 2;
  uint32 partition_id = 3;
  uint64 generation = 4;
}

message InstallAggregatePartitionFenceInternalResponse { uint64 generation = 1; }

message AggregatePartitionCursor {
  uint32 partition_id = 1;
  uint64 next_position = 2;
}

message SubscribeAggregatePartitionsInternalRequest {
  uint64 shard_id = 1;
  AggregateEventSetRef event_set = 2;
  repeated AggregatePartitionCursor cursors = 3;
  bool from_now = 4;
}

message InternalAggregateEvent {
  uint32 partition_id = 1;
  uint64 partition_position = 2;
  AggregateEvent event = 3;
}

message InternalAggregateCaughtUp {
  repeated AggregatePartitionCursor cursors = 1;
}

message SubscribeAggregatePartitionsInternalResponse {
  oneof payload {
    InternalAggregateEvent event = 1;
    InternalAggregateCaughtUp caught_up = 2;
  }
}

message AggregateStatePartitionCursor {
  uint32 partition_id = 1;
  // 排他起点；空字符串表示从头读取。
  string after_aggregate_id = 2;
}

message ListAggregatePartitionStatesInternalRequest {
  uint64 shard_id = 1;
  AggregateEventSetRef event_set = 2;
  repeated AggregateStatePartitionCursor cursors = 3;
  uint32 limit_per_partition = 4;
}

message InternalAggregateStateInfo {
  uint32 partition_id = 1;
  string aggregate_id = 2;
  uint64 revision = 3;
  uint64 modified_unix_millis = 4;
}

message ListAggregatePartitionStatesInternalResponse {
  repeated InternalAggregateStateInfo states = 1;
}

message GetAggregateGroupCatalogInternalRequest { uint64 control_shard_id = 1; }
message GetAggregateGroupCatalogInternalResponse { bytes payload = 1; }

message CommitAggregateGroupCatalogInternalRequest {
  uint64 control_shard_id = 1;
  bytes payload = 2;
}
message CommitAggregateGroupCatalogInternalResponse { bytes payload = 1; }

message FetchAggregateGroupPartitionInternalRequest {
  uint64 shard_id = 1;
  bytes payload = 2;
}
message FetchAggregateGroupPartitionInternalResponse { bytes payload = 1; }

message ApplyAggregateGroupPartitionInternalRequest {
  uint64 shard_id = 1;
  bytes payload = 2;
}
message ApplyAggregateGroupPartitionInternalResponse { bytes payload = 1; }

message InternalSubscribeRequest {
  uint64 shard_id = 1;
  // 空列表表示该 shard 内全部 stream；否则只推送列出的 stream。
  repeated string stream_ids = 2;
}

message InternalSubscribeResponse {
  oneof payload {
    Event event = 1;
    Empty caught_up = 2;
  }
}

message InternalPersistentCursor {
  string stream_id = 1;
  uint64 from_version = 2;
  uint32 max_count = 3;
}

message InternalPersistentReadRequest {
  uint64 shard_id = 1;
  repeated InternalPersistentCursor cursors = 2;
  uint32 max_events = 3;
  uint64 max_bytes = 4;
}

message InternalPersistentReadResponse {
  repeated Event events = 1;
  repeated InternalPersistentHead heads = 2;
}

message InternalPersistentHead {
  string stream_id = 1;
  bool exists = 2;
  uint64 current_version = 3;
}

message GetStreamMetaRequest {
  string stream_id = 1;
}

message GetStreamMetaResponse {
  bool exists = 1;
  // 仅当 exists 为 true 时有意义
  uint64 current_version = 2;
  uint64 shard_id = 3;
}

// ============================================================================
// Raft 内部 RPC：节点间复制与选举（不暴露给客户端）
// ============================================================================

// Raft 节点间通信服务
service RaftRpc {
  // 追加日志条目（含心跳）
  rpc AppendEntries(RaftAppendEntriesRequest) returns (RaftAppendEntriesResponse);
  // 请求投票
  rpc Vote(RaftVoteRequest) returns (RaftVoteResponse);
  // 安装快照
  rpc InstallSnapshot(RaftInstallSnapshotRequest) returns (RaftInstallSnapshotResponse);
}

// AppendEntries RPC：leader 向 follower 复制日志
//
// 每个请求都必须带 shard_id：本节点为每个分片各持有一个独立的 Raft 实例，
// 收到消息后要据此路由到对应实例。缺了它就只能硬编码到某个分片，
// 多分片下会把所有 Raft 消息都投递给错误的实例。
message RaftAppendEntriesRequest {
  uint64 shard_id = 1;
  // 序列化的 openraft::AppendEntriesRequest<TypeConfig>
  // 用 bincode 序列化，避免在 proto 中展开泛型类型
  bytes payload = 2;
}

message RaftAppendEntriesResponse {
  bytes payload = 1; // openraft::AppendEntriesResponse
}

// Vote RPC：candidate 请求投票
message RaftVoteRequest {
  uint64 shard_id = 1;
  bytes payload = 2; // openraft::VoteRequest
}

message RaftVoteResponse {
  bytes payload = 1; // openraft::VoteResponse
}

// InstallSnapshot RPC：leader 向落后节点发送快照
message RaftInstallSnapshotRequest {
  uint64 shard_id = 1;
  bytes payload = 2; // openraft::InstallSnapshotRequest
}

message RaftInstallSnapshotResponse {
  bytes payload = 1; // openraft::InstallSnapshotResponse
}

// ============================================================================
// Raft 集群管理 API：组建集群与查询状态
// ============================================================================

service RaftAdmin {
  // 初始化集群：把给定成员写入首条 membership 日志。只需在一个节点上调用一次。
  rpc Initialize(InitializeRequest) returns (InitializeResponse);
  // 添加学习者：仅接收日志，不参与投票，用于新节点追平数据
  rpc AddLearner(AddLearnerRequest) returns (AddLearnerResponse);
  // 变更成员：把学习者提升为投票成员，或移除成员
  rpc ChangeMembership(ChangeMembershipRequest) returns (ChangeMembershipResponse);
  // 查询某分片的 Raft 运行状态
  rpc GetRaftState(GetRaftStateRequest) returns (GetRaftStateResponse);
  // 列出本节点已注册（承载）的分片
  rpc ListShards(ListShardsRequest) returns (ListShardsResponse);
}

message ListShardsRequest {}

message ListShardsResponse {
  uint64 node_id = 1;
  // 本节点承载的分片 ID（已注册，可被 GetRaftState/读写访问）
  repeated uint64 shard_ids = 2;
}

// ============================================================================
// Migration 服务：路由表同步与在线迁移原语（节点间，不暴露给客户端）
// ============================================================================

// 流路由表同步与迁移辅助服务。
// 路由表（stream → shard）是「专门文件 + 热更新」的分布式实现：
// 变更节点落盘本地 routes.json 后整表广播，接收方按版本号仲裁采纳。
// 迁移原语按显式 shard 寻址（不走路由表），供在线迁移工具（esctl migrate）使用。
service Migration {
  // 拉取路由表（重启恢复 / 探测用）
  rpc GetRouteTable(GetRouteTableRequest) returns (GetRouteTableResponse);
  // 推送路由表（整表广播；version 不大于本地的会被忽略）
  rpc PushRouteTable(PushRouteTableRequest) returns (PushRouteTableResponse);
  // 原子切换流归属（迁移切换点），返回切换后的路由表
  rpc SetStreamShard(SetStreamShardRequest) returns (SetStreamShardResponse);
  // 校准 per-shard 流计数（recount）
  rpc RecountStreams(RecountStreamsRequest) returns (RecountStreamsResponse);
  // 迁移复制写入：显式 shard + 保留源 HLC（不走路由表、不做隐式建流）
  rpc AppendMigrated(AppendMigratedRequest) returns (AppendMigratedResponse);
  // 迁移清尾：删除源 shard 上的流（幂等 no-op）
  rpc DeleteStreamFromShard(DeleteStreamFromShardRequest) returns (DeleteStreamFromShardResponse);
  // 显式 shard 读流（迁移排水/校验用；不走路由表，路由表已切换时仍可读源）
  rpc ReadStreamFromShard(ReadStreamFromShardRequest) returns (stream ReadEventsResponse);
  // 显式 shard 读流元数据
  rpc GetStreamMetaFromShard(GetStreamMetaFromShardRequest) returns (GetStreamMetaResponse);
  // 列出 shard 上的全部流（迁移枚举 / route check 孤儿检测）
  rpc ListStreams(ListStreamsRequest) returns (ListStreamsResponse);
}

// 路由表快照（与 es-core::route::RouteTable 字段一一对应）
message RouteTable {
  uint64 version = 1;
  map<string, uint64> streams = 2;
  map<uint64, uint64> shard_stream_counts = 3;
  // 可选归属代次；旧节点与旧 routes.json 缺失时按 generation=1 导入。
  map<string, uint64> stream_generations = 4;
  // 可选单 Stream revision；旧节点缺失时按整表 version 导入。
  map<string, uint64> stream_revisions = 5;
}

message CommitOwnershipRequest {
  // 承载归属权威的控制 Shard。
  uint64 control_shard_id = 1;
  // bincode 编码的 es_core::OwnershipCommand。
  bytes payload = 2;
}

message CommitOwnershipResponse {
  // bincode 编码的 es_core::OwnershipApply。
  bytes payload = 1;
}

message InstallOwnershipFenceRequest {
  uint64 shard_id = 1;
  string stream_id = 2;
  uint64 generation = 3;
}

message InstallOwnershipFenceResponse {
  uint64 generation = 1;
}

message GetRouteTableRequest {}

message GetRouteTableResponse {
  RouteTable table = 1;
}

message PushRouteTableRequest {
  RouteTable table = 1;
}

message PushRouteTableResponse {}

message SetStreamShardRequest {
  string stream_id = 1;
  uint64 shard_id = 2;
  // 迁移任务在复制开始前观察到的归属；服务端按此执行 CAS。
  uint64 expected_shard_id = 3;
  uint64 expected_generation = 4;
  // 16 字节 UUID；超时重试必须复用，保证 PrepareMove 幂等。
  bytes operation_id = 5;
}

message SetStreamShardResponse {
  RouteTable table = 1;
}

message RecountStreamsRequest {}

message RecountStreamsResponse {
  // 校准后的路由表
  RouteTable table = 1;
}

// 迁移复制写入：单事件一条 raft 日志（hlc 由请求携带保留源时间戳），
// 按显式 shard 寻址（不查路由表、不隐式建流）。逐条写入使幂等索引
// 逐事件记录，重放安全；迁移工具按期望版本链驱动。
message AppendMigratedRequest {
  uint64 shard_id = 1;
  string stream_id = 2;
  ExpectedVersion expected_version = 3;
  MigratedEvent event = 4;
}

// 迁移事件：NewEvent + hlc
message MigratedEvent {
  bytes event_id = 1;
  string event_type = 2;
  bytes data = 3;
  bytes metadata = 4;
  Hlc hlc = 5;
}

message AppendMigratedResponse {
  // 追加后的当前版本
  uint64 next_expected_version = 1;
  // 与 AppendResponse 同语义（迁移工具用于版本链续写）
  uint64 first_position = 2;
  uint64 last_position = 3;
  uint64 shard_id = 4;
}

message DeleteStreamFromShardRequest {
  uint64 shard_id = 1;
  string stream_id = 2;
}

message DeleteStreamFromShardResponse {}

message ReadStreamFromShardRequest {
  uint64 shard_id = 1;
  string stream_id = 2;
  uint64 from_version = 3;
  uint64 max_count = 4;
}

message GetStreamMetaFromShardRequest {
  uint64 shard_id = 1;
  string stream_id = 2;
}

message ListStreamsRequest {
  uint64 shard_id = 1;
}

message ListStreamsResponse {
  repeated string stream_ids = 1;
}

// 集群成员：node_id 与其 Raft RPC 地址
message RaftMember {
  uint64 node_id = 1;
  // 形如 "http://127.0.0.1:50051"，供其它节点回连
  string addr = 2;
}

message InitializeRequest {
  uint64 shard_id = 1;
  repeated RaftMember members = 2;
}

message InitializeResponse {}

message AddLearnerRequest {
  uint64 shard_id = 1;
  RaftMember member = 2;
  // true 表示等该学习者追平日志后再返回
  bool blocking = 3;
}

message AddLearnerResponse {}

message ChangeMembershipRequest {
  uint64 shard_id = 1;
  // 变更后的完整投票成员集合
  repeated uint64 voter_ids = 2;
  // true 表示被移除的成员降级为学习者而非直接剔除
  bool retain = 3;
  // CAS 期望的当前投票成员快照（读-改-写防并发覆盖）。
  // 非空时服务端先校验当前 voters 与之一致才应用变更，不一致返回
  // FailedPrecondition，客户端应重读后重试；空表示不校验（兼容旧客户端）。
  repeated uint64 expected_voters = 4;
}

message ChangeMembershipResponse {}

message GetRaftStateRequest {
  uint64 shard_id = 1;
}

message GetRaftStateResponse {
  uint64 node_id = 1;
  // "Leader" / "Follower" / "Candidate" / "Learner"
  string server_state = 2;
  bool is_leader = 3;
  // 当前已知的 leader，未知时 has_leader 为 false
  bool has_leader = 4;
  uint64 current_leader = 5;
  uint64 current_term = 6;
  bool has_last_log_index = 7;
  uint64 last_log_index = 8;
  bool has_last_applied = 9;
  uint64 last_applied = 10;
  repeated uint64 voter_ids = 11;
}
