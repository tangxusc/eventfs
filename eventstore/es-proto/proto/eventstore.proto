syntax = "proto3";

package eventstore.v1;

// AggregateStore 公共客户端接口：聚合事件、状态文档与消费者组。
//
// 聚合实例由 (business_space, aggregate_type, aggregate_id) 唯一标识。单实例事件按
// aggregate_version 严格递增；不同实例之间不承诺全序。类型级 feed 由 opaque cursor
// 表示续读位置，调用方不得解析 cursor。除特别说明外，非法参数返回 InvalidArgument，
// 目标不存在返回 NotFound，OCC/CAS 冲突返回 FailedPrecondition，非 leader 返回
// Unavailable 并在消息中携带 leader 提示。
service AggregateStore {
  // 返回协议版本、固定分区数和 payload 上限；请求无参数，结果不改变服务器状态。
  rpc GetAggregateStoreCapabilities(GetAggregateStoreCapabilitiesRequest) returns (AggregateStoreCapabilities);
  // 幂等注册聚合类型；参数为类型身份和 16 字节 operation_id，成功返回激活后的定义。
  // 同一 operation_id 可安全重试，复用于不同请求时返回 AlreadyExists 或 FailedPrecondition。
  rpc RegisterAggregateType(RegisterAggregateTypeRequest) returns (AggregateTypeInfo);
  // 按 (business_space, aggregate_type) 升序返回全部聚合类型及其生命周期状态。
  rpc ListAggregateTypes(ListAggregateTypesRequest) returns (ListAggregateTypesResponse);
  // 返回指定聚合类型；参数缺失或非法返回 InvalidArgument，不存在返回 NotFound。
  rpc GetAggregateType(GetAggregateTypeRequest) returns (AggregateTypeInfo);
  // 以实例级期望版本追加一条事件，成功返回新 aggregate_version。
  // 相同 event_id 与相同内容幂等返回原版本；内容不同返回 AlreadyExists。
  rpc AppendAggregateEvent(AppendAggregateEventRequest) returns (AppendAggregateEventResponse);
  // 从 Beginning、Now 或 opaque cursor 追平后持续跟随类型级事件 feed。
  // 每个实例保持 aggregate_version 顺序，不同实例之间不承诺全序；每帧 cursor 是消费该帧
  // 后的续读位置。源暂不可用时发送 degraded，恢复后发送 recovered。
  rpc FollowAggregateTypeEvents(FollowAggregateTypeEventsRequest) returns (stream FollowAggregateTypeEventsResponse);
  // 分页返回存在状态文档的 aggregate_id，按 aggregate_id 字节序稳定排序。
  // page_token 只能原样续传；任一分区不可用时整个请求返回 Unavailable。
  rpc ListAggregateStates(ListAggregateStatesRequest) returns (ListAggregateStatesResponse);
  // 返回指定实例的最新状态、revision 和提交时间；状态不存在返回 NotFound。
  rpc GetAggregateState(GetAggregateStateRequest) returns (GetAggregateStateResponse);
  // 以 absent 或 exact revision 执行状态 CAS 覆盖，成功返回递增 revision 和提交时间。
  rpc PutAggregateState(PutAggregateStateRequest) returns (PutAggregateStateResponse);
  // 返回 catalog revision 及聚合类型数量；请求无参数且不改变服务器状态。
  rpc GetAggregateStoreStatus(GetAggregateStoreStatusRequest) returns (AggregateStoreStatus);
  // 按 partition_id 升序返回固定 256 个虚拟分区的内部放置；仅供运维诊断。
  rpc ListAggregatePartitions(ListAggregatePartitionsRequest) returns (ListAggregatePartitionsResponse);
  // 幂等创建消费者组；参数含起点、设置和 operation_id，返回 revision=1 的定义。
  rpc CreateAggregateGroup(CreateAggregateGroupRequest) returns (AggregateGroupInfo);
  // 以 expected_revision CAS 更新消费者组并递增 revision；reset 起点时同时递增 epoch。
  rpc UpdateAggregateGroup(UpdateAggregateGroupRequest) returns (AggregateGroupInfo);
  // 以 expected_revision CAS 删除消费者组；成功返回 Empty，未确认投递随后失效。
  rpc DeleteAggregateGroup(DeleteAggregateGroupRequest) returns (Empty);
  // 返回指定消费者组；不存在返回 NotFound。
  rpc GetAggregateGroup(GetAggregateGroupRequest) returns (AggregateGroupInfo);
  // 按组名升序返回指定聚合类型下的消费者组。
  rpc ListAggregateGroups(ListAggregateGroupsRequest) returns (ListAggregateGroupsResponse);
  // 长轮询领取一批投递；同一聚合实例同一时刻最多租给一个消费成员。
  // 返回顺序遵循各分区位置，但不同分区之间不承诺全序；delivery_id 为 opaque token。
  rpc FetchAggregateGroup(FetchAggregateGroupRequest) returns (FetchAggregateGroupResponse);
  // 对 delivery 执行 Ack/Retry/Park/Skip；逐项返回结果，重复结算不重复推进进度。
  rpc SettleAggregateGroup(SettleAggregateGroupRequest) returns (SettleAggregateGroupResponse);
  // 为仍由同一 consumer 持有的 delivery 续租；逐项返回新 deadline 或拒绝原因。
  rpc RenewAggregateGroup(RenewAggregateGroupRequest) returns (RenewAggregateGroupResponse);
}

// 聚合类型身份；两个字段均为 1..=128 字节的受限 ASCII 标识符。
message AggregateTypeRef {
  string business_space = 1;
  string aggregate_type = 2;
}

enum AggregateTypeStatus {
  AGGREGATE_TYPE_REGISTERING = 0;
  AGGREGATE_TYPE_ACTIVE = 1;
}

// catalog 中的聚合类型定义；partition_count 固定为 256，注册后不可改变。
message AggregateTypeInfo {
  AggregateTypeRef aggregate_type = 1;
  uint32 partition_count = 2;
  string hash_algorithm = 3;
  AggregateTypeStatus status = 4;
  uint64 catalog_revision = 5;
}

message GetAggregateStoreCapabilitiesRequest {}

message AggregateStoreCapabilities {
  string api_version = 1;
  uint32 partition_count = 2;
  uint64 max_event_bytes = 3;
  uint64 max_state_bytes = 4;
  bool state_revision_cas = 5;
  bool explicit_group_settlement = 6;
  bool state_modified_time = 7;
}

// 注册请求；operation_id 必须是 16 字节 UUID，模糊重试必须复用。
message RegisterAggregateTypeRequest {
  AggregateTypeRef aggregate_type = 1;
  // 16 字节 UUID；中断重试必须复用。
  bytes operation_id = 2;
}

message ListAggregateTypesRequest {}
message ListAggregateTypesResponse { repeated AggregateTypeInfo aggregate_types = 1; }
message GetAggregateTypeRequest { AggregateTypeRef aggregate_type = 1; }

// 事件追加的 OCC 条件；未提供时按 any 处理。
message ExpectedAggregateVersion {
  oneof kind {
    Empty any = 1;
    Empty no_aggregate = 2;
    Empty aggregate_exists = 3;
    uint64 exact = 4;
  }
}

// 客户端提交的事件；event_id 必须是 16 字节 UUID，版本和 HLC 由服务端分配。
message NewAggregateEvent {
  bytes event_id = 1;
  string event_type = 2;
  bytes data = 3;
  bytes metadata = 4;
}

// 已提交事件；aggregate_version 仅在同一聚合实例内严格递增。
message AggregateEvent {
  string aggregate_id = 1;
  uint64 aggregate_version = 2;
  bytes event_id = 3;
  string event_type = 4;
  bytes data = 5;
  bytes metadata = 6;
  Hlc hlc = 7;
}

message AppendAggregateEventRequest {
  AggregateTypeRef aggregate_type = 1;
  string aggregate_id = 2;
  ExpectedAggregateVersion expected_version = 3;
  NewAggregateEvent event = 4;
}

message AppendAggregateEventResponse { uint64 aggregate_version = 1; }

// 类型级 feed 首次连接起点；cursor 是上次响应返回的 opaque 字节。
message AggregateFollowStart {
  oneof kind {
    Empty beginning = 1;
    Empty now = 2;
    bytes cursor = 3;
  }
}

message FollowAggregateTypeEventsRequest {
  AggregateTypeRef aggregate_type = 1;
  AggregateFollowStart start = 2;
}

message AggregateReadDegraded {
  uint32 unavailable_source_count = 1;
  bool retrying = 2;
}

// 类型级 feed frame；event/caught_up/degraded/recovered 四者恰有其一。
message FollowAggregateTypeEventsResponse {
  oneof payload {
    AggregateEvent event = 1;
    Empty caught_up = 2;
    AggregateReadDegraded degraded = 3;
    Empty recovered = 4;
  }
  // 消费完当前 frame 后的 opaque 续读位置。
  bytes cursor = 5;
}

message ListAggregateStatesRequest {
  AggregateTypeRef aggregate_type = 1;
  uint32 page_size = 2;
  bytes page_token = 3;
}

// 状态目录项；不包含状态正文。
message AggregateStateInfo {
  string aggregate_id = 1;
  uint64 revision = 2;
  uint64 modified_unix_millis = 3;
}

message ListAggregateStatesResponse {
  repeated AggregateStateInfo states = 1;
  bytes next_page_token = 2;
}

message GetAggregateStateRequest {
  AggregateTypeRef aggregate_type = 1;
  string aggregate_id = 2;
}

message GetAggregateStateResponse {
  uint64 revision = 1;
  bytes data = 2;
  uint64 modified_unix_millis = 3;
}

// 状态覆盖的 CAS 条件；必须显式提供 absent 或 exact。
message ExpectedStateRevision {
  oneof kind {
    Empty absent = 1;
    uint64 exact = 2;
  }
}

message PutAggregateStateRequest {
  AggregateTypeRef aggregate_type = 1;
  string aggregate_id = 2;
  ExpectedStateRevision expected_revision = 3;
  bytes data = 4;
}

message PutAggregateStateResponse {
  uint64 revision = 1;
  uint64 modified_unix_millis = 2;
}
message GetAggregateStoreStatusRequest {}

message AggregateStoreStatus {
  uint64 catalog_revision = 1;
  uint32 aggregate_type_count = 2;
  uint32 registering_aggregate_type_count = 3;
  uint32 active_aggregate_type_count = 4;
}

message ListAggregatePartitionsRequest { AggregateTypeRef aggregate_type = 1; }

message AggregatePartitionInfo {
  uint32 partition_id = 1;
  uint64 shard_id = 2;
  uint64 generation = 3;
  bool moving = 4;
  uint64 target_shard_id = 5;
}

message ListAggregatePartitionsResponse { repeated AggregatePartitionInfo partitions = 1; }

message AggregateGroupStart {
  oneof kind {
    Empty beginning = 1;
    Empty now = 2;
  }
}

// 消费者组流控、租约与重试设置；服务端校验各字段边界。
message AggregateGroupSettings {
  uint32 max_unacked_per_consumer = 1;
  uint32 max_unacked_per_group = 2;
  uint64 ack_timeout_ms = 3;
  uint32 max_retries = 4;
  uint64 retry_min_ms = 5;
  uint64 retry_max_ms = 6;
}

message AggregateGroupInfo {
  AggregateTypeRef aggregate_type = 1;
  string name = 2;
  uint64 revision = 3;
  uint64 epoch = 4;
  AggregateGroupStart start = 5;
  AggregateGroupSettings settings = 6;
}

message CreateAggregateGroupRequest {
  AggregateTypeRef aggregate_type = 1;
  string name = 2;
  AggregateGroupStart start = 3;
  AggregateGroupSettings settings = 4;
  bytes operation_id = 5;
}

message UpdateAggregateGroupRequest {
  AggregateTypeRef aggregate_type = 1;
  string name = 2;
  uint64 expected_revision = 3;
  AggregateGroupStart start = 4;
  AggregateGroupSettings settings = 5;
  bytes operation_id = 6;
}

message DeleteAggregateGroupRequest {
  AggregateTypeRef aggregate_type = 1;
  string name = 2;
  uint64 expected_revision = 3;
  bytes operation_id = 4;
}

message GetAggregateGroupRequest {
  AggregateTypeRef aggregate_type = 1;
  string name = 2;
}

message ListAggregateGroupsRequest { AggregateTypeRef aggregate_type = 1; }
message ListAggregateGroupsResponse { repeated AggregateGroupInfo groups = 1; }

// 一次带租约的投递；delivery_id 只能传给 settle/renew，不得解析或持久构造。
message AggregateGroupDelivery {
  bytes delivery_id = 1;
  AggregateEvent event = 2;
  uint32 attempt = 3;
  uint64 deadline_ms = 4;
  bool replayed = 5;
}

message FetchAggregateGroupRequest {
  AggregateTypeRef aggregate_type = 1;
  string name = 2;
  string consumer_id = 3;
  uint32 max_events = 4;
  uint64 max_bytes = 5;
  uint64 wait_ms = 6;
}

message FetchAggregateGroupResponse {
  repeated AggregateGroupDelivery deliveries = 1;
  bool caught_up = 2;
  bool throttled = 3;
}

enum AggregateGroupSettlementAction {
  AGGREGATE_GROUP_SETTLEMENT_ACK = 0;
  AGGREGATE_GROUP_SETTLEMENT_RETRY = 1;
  AGGREGATE_GROUP_SETTLEMENT_PARK = 2;
  AGGREGATE_GROUP_SETTLEMENT_SKIP = 3;
}

message AggregateGroupSettlement {
  bytes delivery_id = 1;
  AggregateGroupSettlementAction action = 2;
  string reason = 3;
}

enum AggregateGroupSettlementStatus {
  AGGREGATE_GROUP_SETTLEMENT_APPLIED = 0;
  AGGREGATE_GROUP_SETTLEMENT_ALREADY_SETTLED = 1;
  AGGREGATE_GROUP_SETTLEMENT_STALE_LEASE = 2;
  AGGREGATE_GROUP_SETTLEMENT_WRONG_CONSUMER = 3;
}

message AggregateGroupSettlementResult {
  bytes delivery_id = 1;
  AggregateGroupSettlementStatus status = 2;
  // Renew 成功后的服务端租约截止时间；Settle 或未续租时为 0。
  uint64 deadline_ms = 3;
}

message SettleAggregateGroupRequest {
  AggregateTypeRef aggregate_type = 1;
  string name = 2;
  string consumer_id = 3;
  repeated AggregateGroupSettlement settlements = 4;
}

message SettleAggregateGroupResponse {
  repeated AggregateGroupSettlementResult results = 1;
}

message RenewAggregateGroupRequest {
  AggregateTypeRef aggregate_type = 1;
  string name = 2;
  string consumer_id = 3;
  repeated bytes delivery_ids = 4;
}

message RenewAggregateGroupResponse {
  repeated AggregateGroupSettlementResult results = 1;
}

// 混合逻辑时钟：由 leader 在写入前分配并随事件落盘
message Hlc {
  uint64 wall = 1;    // 物理时间，毫秒
  uint32 logical = 2; // 同毫秒内逻辑计数
}

message Empty {}

// AggregateStore 的节点间显式 Shard 协议，只注册到内部监听端口。
service AggregateStoreInternal {
  rpc GetAggregateCatalogInternal(GetAggregateCatalogInternalRequest) returns (GetAggregateCatalogInternalResponse);
  rpc CommitAggregateCatalogInternal(CommitAggregateCatalogInternalRequest) returns (CommitAggregateCatalogInternalResponse);
  rpc InstallAggregatePartitionFenceInternal(InstallAggregatePartitionFenceInternalRequest) returns (InstallAggregatePartitionFenceInternalResponse);
  rpc SubscribeAggregatePartitionsInternal(SubscribeAggregatePartitionsInternalRequest) returns (stream SubscribeAggregatePartitionsInternalResponse);
  rpc ListAggregatePartitionStatesInternal(ListAggregatePartitionStatesInternalRequest) returns (ListAggregatePartitionStatesInternalResponse);
  rpc GetAggregateGroupCatalogInternal(GetAggregateGroupCatalogInternalRequest) returns (GetAggregateGroupCatalogInternalResponse);
  rpc CommitAggregateGroupCatalogInternal(CommitAggregateGroupCatalogInternalRequest) returns (CommitAggregateGroupCatalogInternalResponse);
  rpc FetchAggregateGroupPartitionInternal(FetchAggregateGroupPartitionInternalRequest) returns (FetchAggregateGroupPartitionInternalResponse);
  rpc ApplyAggregateGroupPartitionInternal(ApplyAggregateGroupPartitionInternalRequest) returns (ApplyAggregateGroupPartitionInternalResponse);
}

message GetAggregateCatalogInternalRequest { uint64 control_shard_id = 1; }
message GetAggregateCatalogInternalResponse { bytes payload = 1; }

message CommitAggregateCatalogInternalRequest {
  uint64 control_shard_id = 1;
  bytes payload = 2; // bincode 编码的 AggregateCatalogCommand
}

message CommitAggregateCatalogInternalResponse {
  bytes payload = 1; // bincode 编码的 AggregateCatalogApply
}

message InstallAggregatePartitionFenceInternalRequest {
  uint64 shard_id = 1;
  AggregateTypeRef aggregate_type = 2;
  uint32 partition_id = 3;
  uint64 generation = 4;
}

message InstallAggregatePartitionFenceInternalResponse { uint64 generation = 1; }

message AggregatePartitionCursor {
  uint32 partition_id = 1;
  uint64 next_position = 2;
}

message SubscribeAggregatePartitionsInternalRequest {
  uint64 shard_id = 1;
  AggregateTypeRef aggregate_type = 2;
  repeated AggregatePartitionCursor cursors = 3;
  bool from_now = 4;
}

message InternalAggregateEvent {
  uint32 partition_id = 1;
  uint64 partition_position = 2;
  AggregateEvent event = 3;
}

message InternalAggregateCaughtUp {
  repeated AggregatePartitionCursor cursors = 1;
}

message SubscribeAggregatePartitionsInternalResponse {
  oneof payload {
    InternalAggregateEvent event = 1;
    InternalAggregateCaughtUp caught_up = 2;
  }
}

message AggregateStatePartitionCursor {
  uint32 partition_id = 1;
  // 排他起点；空字符串表示从头读取。
  string after_aggregate_id = 2;
}

message ListAggregatePartitionStatesInternalRequest {
  uint64 shard_id = 1;
  AggregateTypeRef aggregate_type = 2;
  repeated AggregateStatePartitionCursor cursors = 3;
  uint32 limit_per_partition = 4;
}

message InternalAggregateStateInfo {
  uint32 partition_id = 1;
  string aggregate_id = 2;
  uint64 revision = 3;
  uint64 modified_unix_millis = 4;
}

message ListAggregatePartitionStatesInternalResponse {
  repeated InternalAggregateStateInfo states = 1;
}

message GetAggregateGroupCatalogInternalRequest { uint64 control_shard_id = 1; }
message GetAggregateGroupCatalogInternalResponse { bytes payload = 1; }

message CommitAggregateGroupCatalogInternalRequest {
  uint64 control_shard_id = 1;
  bytes payload = 2;
}
message CommitAggregateGroupCatalogInternalResponse { bytes payload = 1; }

message FetchAggregateGroupPartitionInternalRequest {
  uint64 shard_id = 1;
  bytes payload = 2;
}
message FetchAggregateGroupPartitionInternalResponse { bytes payload = 1; }

message ApplyAggregateGroupPartitionInternalRequest {
  uint64 shard_id = 1;
  bytes payload = 2;
}
message ApplyAggregateGroupPartitionInternalResponse { bytes payload = 1; }

// ============================================================================
// Raft 内部 RPC：节点间复制与选举（不暴露给客户端）
// ============================================================================

// Raft 节点间通信服务
service RaftRpc {
  // 追加日志条目（含心跳）
  rpc AppendEntries(RaftAppendEntriesRequest) returns (RaftAppendEntriesResponse);
  // 请求投票
  rpc Vote(RaftVoteRequest) returns (RaftVoteResponse);
  // 安装快照
  rpc InstallSnapshot(RaftInstallSnapshotRequest) returns (RaftInstallSnapshotResponse);
}

// AppendEntries RPC：leader 向 follower 复制日志
//
// 每个请求都必须带 shard_id：本节点为每个分片各持有一个独立的 Raft 实例，
// 收到消息后要据此路由到对应实例。缺了它就只能硬编码到某个分片，
// 多分片下会把所有 Raft 消息都投递给错误的实例。
message RaftAppendEntriesRequest {
  uint64 shard_id = 1;
  // 序列化的 openraft::AppendEntriesRequest<TypeConfig>
  // 用 bincode 序列化，避免在 proto 中展开泛型类型
  bytes payload = 2;
}

message RaftAppendEntriesResponse {
  bytes payload = 1; // openraft::AppendEntriesResponse
}

// Vote RPC：candidate 请求投票
message RaftVoteRequest {
  uint64 shard_id = 1;
  bytes payload = 2; // openraft::VoteRequest
}

message RaftVoteResponse {
  bytes payload = 1; // openraft::VoteResponse
}

// InstallSnapshot RPC：leader 向落后节点发送快照
message RaftInstallSnapshotRequest {
  uint64 shard_id = 1;
  bytes payload = 2; // openraft::InstallSnapshotRequest
}

message RaftInstallSnapshotResponse {
  bytes payload = 1; // openraft::InstallSnapshotResponse
}

// ============================================================================
// Raft 集群管理 API：组建集群与查询状态
// ============================================================================

service RaftAdmin {
  // 初始化集群：把给定成员写入首条 membership 日志。只需在一个节点上调用一次。
  rpc Initialize(InitializeRequest) returns (InitializeResponse);
  // 添加学习者：仅接收日志，不参与投票，用于新节点追平数据
  rpc AddLearner(AddLearnerRequest) returns (AddLearnerResponse);
  // 变更成员：把学习者提升为投票成员，或移除成员
  rpc ChangeMembership(ChangeMembershipRequest) returns (ChangeMembershipResponse);
  // 查询某分片的 Raft 运行状态
  rpc GetRaftState(GetRaftStateRequest) returns (GetRaftStateResponse);
  // 列出本节点已注册（承载）的分片
  rpc ListShards(ListShardsRequest) returns (ListShardsResponse);
}

message ListShardsRequest {}

message ListShardsResponse {
  uint64 node_id = 1;
  // 本节点承载的分片 ID（已注册，可被 GetRaftState/读写访问）
  repeated uint64 shard_ids = 2;
}

message RaftMember {
  uint64 node_id = 1;
  // 形如 "http://127.0.0.1:50051"，供其它节点回连
  string addr = 2;
}

message InitializeRequest {
  uint64 shard_id = 1;
  repeated RaftMember members = 2;
}

message InitializeResponse {}

message AddLearnerRequest {
  uint64 shard_id = 1;
  RaftMember member = 2;
  // true 表示等该学习者追平日志后再返回
  bool blocking = 3;
}

message AddLearnerResponse {}

message ChangeMembershipRequest {
  uint64 shard_id = 1;
  // 变更后的完整投票成员集合
  repeated uint64 voter_ids = 2;
  // true 表示被移除的成员降级为学习者而非直接剔除
  bool retain = 3;
  // CAS 期望的当前投票成员快照（读-改-写防并发覆盖）。
  // 非空时服务端先校验当前 voters 与之一致才应用变更，不一致返回
  // FailedPrecondition，客户端应重读后重试；空表示不校验（兼容旧客户端）。
  repeated uint64 expected_voters = 4;
}

message ChangeMembershipResponse {}

message GetRaftStateRequest {
  uint64 shard_id = 1;
}

message GetRaftStateResponse {
  uint64 node_id = 1;
  // "Leader" / "Follower" / "Candidate" / "Learner"
  string server_state = 2;
  bool is_leader = 3;
  // 当前已知的 leader，未知时 has_leader 为 false
  bool has_leader = 4;
  uint64 current_leader = 5;
  uint64 current_term = 6;
  bool has_last_log_index = 7;
  uint64 last_log_index = 8;
  bool has_last_applied = 9;
  uint64 last_applied = 10;
  repeated uint64 voter_ids = 11;
}
